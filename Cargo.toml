[workspace]
resolver = "2"
members = ["crates/installer-core", "crates/installer-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/linusammon/nun-installer"

[workspace.dependencies]
installer-core = { path = "crates/installer-core" }
ratatui = "0.29"
crossterm = "0.28"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
